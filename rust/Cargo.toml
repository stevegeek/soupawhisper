[package]
name = "soupawhisper"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Push-to-talk voice dictation for Linux on transcribe.cpp (Whisper, Granite Speech)"
build = "build.rs"

[dependencies]
anyhow = "1"
evdev = "0.13"
ksni = { version = "0.3.7", features = ["blocking"] }
libc = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
transcribe-cpp = { version = "0.4", default-features = false }

[features]
default = ["cuda"]
cuda = ["transcribe-cpp/cuda"]
vulkan = ["transcribe-cpp/vulkan"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
