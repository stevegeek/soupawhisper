# SoupaWhisper config: ~/.config/soupawhisper/config.ini

[engine]
# Transcription engine: whisper or granite (IBM Granite Speech: English-focused, en/fr/de/es/pt/ja)
# Device: cpu or cuda (cuda means the GPU; a Vulkan build uses Vulkan here).
# Switch from the tray menu; that choice is saved to state.ini and wins over this.
engine = whisper
device = cpu

# GGUF quantization to download: Q8_0 (default), Q5_K_M (smaller), F16 / BF16 (larger)
quant = Q8_0

# Names, acronyms and jargon to favour, comma-separated. Granite gets them as its
# keyword list, Whisper as an initial prompt.
keywords = Rails, Sidekiq, PostgreSQL, Kubernetes

[whisper]
# Model: tiny.en, base.en, small.en, medium.en, large-v3, large-v3-turbo, ...
# or a path to a .gguf file
model = large-v3-turbo

# Language: auto (full auto-detect), en (force English), or en,it,el (auto-detect,
# re-run in the first one if something else is detected)
language = auto

# CPU threads (default: half the cores, at most 8)
# threads = 8

# Free the model after this many idle minutes; it reloads while you speak (0 = never)
unload_after = 0

[granite]
# Hugging Face id of the Granite model, or a path to a .gguf file
model = ibm-granite/granite-speech-4.1-2b

[hotkey]
# Key: f1-f24, scroll_lock, pause, insert, home, end, pageup, pagedown
key = f12

[behavior]
# Paste the text into the focused window
auto_type = true

# Show desktop notifications
notifications = true

# Paste shortcut for auto_type (e.g. ctrl+v, super+v, cmd+v)
paste_keys = ctrl+v

# Paste shortcut when a terminal has focus; none = use paste_keys everywhere.
# The focused app is known on KDE Plasma (through a small KWin script); elsewhere
# paste_keys is always used.
terminal_paste_keys = ctrl+shift+v

# Window classes that count as terminals (default: Konsole, Yakuake, kitty, Alacritty,
# foot, WezTerm, Ghostty, GNOME Terminal, Ptyxis, xfce4-terminal, Terminator, Tilix, xterm, ...)
# terminal_apps = org.kde.konsole, kitty

# Recording mode:
#   hold   - hold the key to record, release to transcribe
#   toggle - tap the key to start recording, tap again to transcribe
#   auto   - a quick tap toggles, a longer hold records while held
record_mode = auto

# auto mode only: seconds before entering "hold-to-record" mode, otherwise "toggle" mode
long_press = 0.4

[audio]
# ALSA capture device (default = system default, or e.g. plughw:1,0)
# device = plughw:1,0

[vad]
# Voice activity detection drops silence before the model sees the audio.
# Raise these if breaths or keyboard noise get transcribed as made-up words.
# Speech probability needed to count as speech (0-1)
threshold = 0.5
# Drop speech fragments shorter than this many milliseconds
min_speech_ms = 0
