[whisper]
# Model size: tiny.en, base.en, small.en, medium.en, large-v3
model = base.en

# Device: cpu or cuda (cuda requires cuDNN)
device = cpu

# Compute type: int8 for CPU, float16 for GPU
compute_type = int8

[hotkey]
# Key to hold for recording: f12, scroll_lock, pause, etc.
key = f12

[behavior]
# Type text into active input field
auto_type = true

# Show desktop notification
notifications = true

# Recording mode:
#   hold   - hold the key to record, release to transcribe
#   toggle - tap the key to start recording, tap again to transcribe
#   auto   - a quick tap toggles, a longer hold records while held
record_mode = auto

# auto mode only: seconds before entering "hold-to-record" mode, otherwise "toggle" mode
long_press = 0.4

[engine]
# Transcription engine: whisper (faster-whisper) or granite (IBM Granite Speech, needs requirements-granite.txt)
# Device: cpu or cuda. Switch from the tray menu; that choice is saved to state.ini and wins over this.
engine = whisper
device = cpu

[granite]
# Hugging Face model id (downloaded on first use, ~5 GB)
model = ibm-granite/granite-speech-4.1-2b
# Comma-separated terms Granite should favour (names, acronyms, jargon)
keywords = Rails, Sidekiq, PostgreSQL, Kubernetes

[vad]
# Voice activity detection: drops silence before Whisper sees the audio.
# Raise these if breaths/keyboard noise get transcribed as made-up words.
# Speech probability needed to count as speech (0-1)
threshold = 0.5
# Drop speech fragments shorter than this many milliseconds
min_speech_ms = 0
